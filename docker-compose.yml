name: asset-vault

# Database logins (design note M1.2, decision 3). POSTGRES_USER is the bootstrap
# superuser: only the Postgres image and an admin use it. The migrate service
# connects as vault_migrator (owns the schema); web and worker as vault_app
# (no superuser, owns nothing). The roles are created on the first start of an
# empty volume by packages/db/initdb/10-vault-roles.sh.
x-migrator-url: &migrator-url postgres://vault_migrator:${VAULT_MIGRATOR_PASSWORD:?Set VAULT_MIGRATOR_PASSWORD in .env (copy .env.example)}@postgres:5432/${POSTGRES_DB:-vault}
x-app-url: &app-url postgres://vault_app:${VAULT_APP_PASSWORD:?Set VAULT_APP_PASSWORD in .env (copy .env.example)}@postgres:5432/${POSTGRES_DB:-vault}
# The address people open the app at (M1.3): cookies, CSRF checks and setup links use it.
x-app-origin: &app-origin ${APP_URL:-http://127.0.0.1:${WEB_PORT:-3000}}

services:
  postgres:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      VAULT_MIGRATOR_PASSWORD: ${VAULT_MIGRATOR_PASSWORD:?Set VAULT_MIGRATOR_PASSWORD in .env (copy .env.example)}
      VAULT_APP_PASSWORD: ${VAULT_APP_PASSWORD:?Set VAULT_APP_PASSWORD in .env (copy .env.example)}
    configs:
      - source: vault-roles
        target: /docker-entrypoint-initdb.d/10-vault-roles.sh
    # No ports: Postgres is reachable only from the other services.
    # No cap_drop: its entrypoint starts as root and needs capabilities to drop to the postgres user.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: applies pending migrations, then exits. web and worker start only
  # after it exits 0, so a failed migration keeps the old schema and no new code
  # runs against it (review L7). Same image as the worker.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["node", "packages/db/src/cli.ts", "up"]
    restart: "no"
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      DATABASE_URL: *migrator-url
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # APP_URL is for the user commands run in this image (pnpm user:create prints a setup
    # link). The worker never gets AUTH_ENCRYPTION_KEY: it needs none.
    environment:
      DATABASE_URL: *app-url
      APP_URL: *app-origin
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/src/healthcheck.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      DATABASE_URL: *app-url
      APP_URL: *app-origin
      # Encrypts TOTP secrets, keys backup-code hashes and signs auth cookies (M1.3). No default.
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set AUTH_ENCRYPTION_KEY in .env (copy .env.example)}
      # The one header that carries the client IP, set by a proxy that overwrites it
      # (e.g. cf-connecting-ip behind Cloudflare, M1.4). Empty: unknown, never X-Forwarded-For.
      AUTH_TRUSTED_IP_HEADER: ${AUTH_TRUSTED_IP_HEADER:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:

configs:
  vault-roles:
    file: ./packages/db/initdb/10-vault-roles.sh
